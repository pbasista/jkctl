[project]
name = "jkctl"
dynamic = ["version"]
description = "Inspect and configure JK BMS battery management systems over RS485 Modbus, and flash their firmware."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Peter Bašista", email = "pbasista@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "devicectl-core>=0.1.0",
    "pyserial>=3.5",
    "tomli>=2; python_version < '3.11'",
]
keywords = [
    "jk-bms",
    "jkbms",
    "bms",
    "battery",
    "lifepo4",
    "modbus",
    "rs485",
    "firmware",
    "web-ui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/pbasista/jkctl"
Repository = "https://github.com/pbasista/jkctl"
Issues = "https://github.com/pbasista/jkctl/issues"
Releases = "https://github.com/pbasista/jkctl/releases"
License = "https://github.com/pbasista/jkctl/blob/main/LICENSE"

[project.scripts]
jkctl = "jkctl.cli:main"

[dependency-groups]
# `uv run` and `uv sync` install this group by default, so anything in it is
# installed by merely *using* jkctl from a checkout.  It stays small and pure
# Python for that reason: a target host here is a Raspberry Pi 3, where a
# dependency with no armv7 wheel is a compiler run rather than a download.
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    # config.py reads `import tomli` on 3.10 and `tomllib` above it.  ty is
    # configured for 3.10 below, so it always takes the tomli branch whatever
    # interpreter it runs on; without this the module is missing there.  The
    # runtime dependency keeps its `python_version < '3.11'` marker.
    "tomli>=2",
    "ty>=0.0.1a21",
]

# The two checks that need a real engine rather than a parser of our own.
# Opt in with `uv sync --group browser`, which is what CI does; both checks
# and their tests skip themselves, saying so, when the engine is absent.
#
#   * mini-racer is an embedded V8 that devicectl.devtools.htmcheck runs the
#     vendored preact-htm bundle in, so every `html` template is parsed by the
#     same code the browser will parse it with.  It is ~80 MB and publishes no
#     armv7 wheel.
#   * playwright drives the headless Chromium that tools/rendercheck.py and
#     tools/screenshot.py draw the page in.  The browser itself is a further
#     download: `uv run --group browser python -m playwright install chromium`.
browser = [
    "mini-racer>=0.12",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jkctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jkctl"]

# research/ holds the material this tool was reimplemented from -- the vendor
# Windows installer and its DLLs, the Android APK, 67 firmware images, Ghidra
# projects.  Only the findings notes are tracked, but hatchling reads the root
# .gitignore and not research/.gitignore, so a build in a working directory
# that has the rest would pack all ~195 MB of it -- most of it JK's to
# distribute, not ours.  Name it here instead.
[tool.hatch.build.targets.sdist]
exclude = ["/research"]

[tool.ruff]
line-length = 88
target-version = "py310"
# research/ holds the reverse-engineering material and the throwaway scripts
# that produced it -- decompiler dumps, xref finders, a standalone container
# decryptor.  They are a record of how the protocol was recovered, not code
# this project maintains, and reformatting them would only obscure that.
extend-exclude = ["research"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Pydocstyle (D, PEP 257) keeps docstrings honest; PLR2004 flags magic numbers,
# so protocol values end up in named constants.  BLE001 makes `except
# Exception` say why it is right -- a narrow rule from a wider family we do not
# select -- and RUF100 is what keeps a suppression from outliving the rule it
# names.  C901 and PLR0912 are the guard against a function growing back into
# several: at the default thresholds, every one they flagged turned out to be
# two or three simple things sharing a body.
select = ["E", "F", "W", "D", "I", "BLE001", "C901", "PLR0912", "PLR2004", "RUF100"]
# The formatter keeps code within 88 columns, but we do not enforce E501 on
# comments/docstrings/strings (the formatter never breaks those, and a few --
# like the recovered register tables -- must stay verbatim).
ignore = ["E501"]

[tool.ruff.lint.isort]
# `from jkctl import bms, status as status_mod` is one thought and
# stays one statement; without this, isort splits every aliased name into a
# second import of the same module.
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings and naturally use literal fixture values.
"tests/**" = ["D", "PLR2004"]

# ty (Astral's type checker) runs over the package only.  The tests are full of
# deliberately partial fakes -- a FakeBus implements the four methods the code
# under test calls and nothing else -- and typing those to a checker's
# satisfaction would obscure what each one is standing in for.
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # the engine's ctypes structs predate Python 3.14's _layout_ warnings
    "ignore:Due to '_pack_':DeprecationWarning:py_mini_racer",
]
